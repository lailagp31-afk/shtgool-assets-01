name: Fetch Firebase images
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Download directly to GitHub runner
        run: |
          python3 - <<'PY'
          import json, pathlib, urllib.request, concurrent.futures, os
          items=json.load(open('manifest.json'))
          out=pathlib.Path('images'); out.mkdir(exist_ok=True)
          def fetch(item):
              dest=out/item['file']
              if dest.exists(): return ('skip',item['file'],dest.stat().st_size)
              try:
                  req=urllib.request.Request(item['url'],headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=60) as r:
                      data=r.read()
                  if len(data)>100*1024*1024: return ('large',item['file'],len(data))
                  dest.write_bytes(data)
                  return ('ok',item['file'],len(data))
              except Exception as e: return ('error',item['file'],str(e))
          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as ex:
              results=list(ex.map(fetch,items))
          ok=[x for x in results if x[0] in ('ok','skip')]
          bad=[x for x in results if x[0] not in ('ok','skip')]
          json.dump({'downloaded':len(ok),'failed':bad},open('transfer-report.json','w'),ensure_ascii=False)
          print('downloaded',len(ok),'failed',len(bad),'bytes',sum(x[2] for x in ok))
          PY
      - name: Commit downloaded images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images transfer-report.json
          git commit -m "Fetch first image batch" || exit 0
          git push
